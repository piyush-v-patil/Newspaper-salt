name: Web app

# Publishes the web app to GitHub Pages on every push to the default branch.
# One-time setup: repository Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [ccr-19cc639c-3yftji]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest push is published.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build for the repository's Pages address
        run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/

      # Pages answers unknown paths with 404.html; making it the app lets
      # deep links such as /today or /settings load and reload.
      - name: Let deep links open the app
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
