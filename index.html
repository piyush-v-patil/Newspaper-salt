<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Of Pi</title>
    <script>
      // Set the theme before first paint so there is no flash.
      try {
        var m = localStorage.getItem('pi-theme') || 'system';
        var dark = m === 'on' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var vars = JSON.parse(localStorage.getItem(dark ? 'pi-theme-dark' : 'pi-theme-light') || '{}');
        for (var k in vars) document.documentElement.style.setProperty(k, vars[k]);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
